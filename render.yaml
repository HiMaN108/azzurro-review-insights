# Render Blueprint: API + collector on the free plan (Docker, Playwright Chromium).
# Render dashboard → New → Blueprint → pick this repo. Secrets (sync: false) are asked for once.
# Free plan notes: 512 MB RAM, sleeps after 15 min idle (first request then takes ~1 min),
# and the in-process SCRAPE_CRON only fires while the service is awake.
services:
  - type: web
    name: azzurro-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_AI_KEY
        sync: false
      - key: SCRAPE_CRON
        value: "0 6 * * *"
      - key: SCRAPE_MAX_PAGES_PER_PROPERTY
        value: "40"
      - key: SCRAPE_DELAY_MS_MIN
        value: "2500"
      - key: SCRAPE_DELAY_MS_MAX
        value: "6000"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BATCH_SIZE
        value: "8"
      - key: LLM_TOKENS_PER_MINUTE
        value: "6000"
      - key: LLM_MAX_REVIEWS_PER_RUN
        value: "300"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "4096"
      - key: LLM_EXTRA_BODY
        value: '{"reasoning_effort":"low"}'
      - key: LLM_FALLBACK_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash,gemini-flash-lite-latest
      - key: LLM_FALLBACK_EXTRA_BODY
        value: '{"reasoning_effort":"low"}'
      - key: ASK_RATE_LIMIT_PER_HOUR
        value: "20"
